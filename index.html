<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XOXO - Tic Tac Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(10, 10, 26, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    #toolbar h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ff6b6b, #ffa500);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: auto;
    }

    #turn-indicator {
      font-size: 0.95rem;
      color: #aaa;
      margin-right: 12px;
    }
    #turn-indicator span { color: #ffa500; font-weight: 600; }

    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(238,90,36,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .btn-leaderboard {
      background: rgba(255,165,0,0.15);
      color: #ffa500;
      border: 1px solid rgba(255,165,0,0.3);
    }
    .btn-leaderboard:hover { background: rgba(255,165,0,0.25); }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      min-width: 380px;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal h2 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      text-align: center;
      color: #ffa500;
    }
    .modal label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    .modal input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal input[type="text"]:focus { border-color: #ffa500; }

    .symbol-picker {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .symbol-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .symbol-btn.selected {
      border-color: #ffa500;
      background: rgba(255,165,0,0.15);
      color: #ffa500;
    }
    .symbol-btn:hover { border-color: rgba(255,165,0,0.5); }

    .modal-actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* Coin flip */
    #coin-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #coin-overlay.active { display: flex; }

    .coin-container {
      perspective: 600px;
      margin-bottom: 30px;
    }
    .coin {
      width: 120px; height: 120px;
      border-radius: 50%;
      position: relative;
      transform-style: preserve-3d;
      font-size: 2.5rem;
      font-weight: 800;
    }
    .coin .front, .coin .back {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }
    .coin .front {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
    }
    .coin .back {
      background: linear-gradient(135deg, #4ecdc4, #44bd9e);
      color: #fff;
      transform: rotateY(180deg);
    }
    @keyframes coinFlip {
      0% { transform: rotateY(0deg) translateY(0); }
      50% { transform: rotateY(900deg) translateY(-150px); }
      100% { transform: rotateY(var(--final-rotation)) translateY(0); }
    }
    .coin.flipping {
      animation: coinFlip 1.8s ease-in-out forwards;
    }
    #coin-result {
      font-size: 1.3rem;
      color: #ffa500;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #coin-result.visible { opacity: 1; }

    /* Winner overlay */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 250;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #winner-overlay.active { display: flex; }
    #winner-text {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffa500, #ff6b6b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #winner-sub { color: #aaa; margin-bottom: 28px; font-size: 1.1rem; }

    /* Leaderboard modal */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    .leaderboard-table th {
      text-align: left;
      padding: 8px 12px;
      color: #ffa500;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
    }
    .leaderboard-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
      color: #ccc;
    }
    .leaderboard-table tr:hover td { color: #fff; }
    .no-scores { text-align: center; color: #666; padding: 24px; }
  </style>
</head>
<body>

  <div id="toolbar">
    <h1>XOXO</h1>
    <div id="turn-indicator"></div>
    <button class="btn btn-primary" id="btn-start">Start Game</button>
    <button class="btn btn-secondary" id="btn-reset" disabled>Reset</button>
    <button class="btn btn-leaderboard" id="btn-leaderboard">Leaderboard</button>
  </div>

  <div id="canvas-container"></div>

  <!-- Start Game Modal -->
  <div class="modal-overlay" id="start-modal">
    <div class="modal" role="dialog" aria-labelledby="start-modal-title">
      <h2 id="start-modal-title">New Game</h2>
      <label for="player1-name">Player 1 Name</label>
      <input type="text" id="player1-name" placeholder="Player 1" maxlength="20" />
      <label>Player 1 Symbol</label>
      <div class="symbol-picker">
        <button class="symbol-btn selected" data-symbol="X" aria-label="Choose X">X</button>
        <button class="symbol-btn" data-symbol="O" aria-label="Choose O">O</button>
      </div>
      <label for="player2-name">Player 2 Name</label>
      <input type="text" id="player2-name" placeholder="Player 2" maxlength="20" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancel-start">Cancel</button>
        <button class="btn btn-primary" id="confirm-start">Start</button>
      </div>
    </div>
  </div>

  <!-- Coin Flip Overlay -->
  <div id="coin-overlay">
    <div class="coin-container">
      <div class="coin" id="coin">
        <div class="front">X</div>
        <div class="back">O</div>
      </div>
    </div>
    <div id="coin-result"></div>
  </div>

  <!-- Winner Overlay -->
  <div id="winner-overlay">
    <div id="winner-text"></div>
    <div id="winner-sub"></div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-primary" id="btn-play-again">Play Again</button>
      <button class="btn btn-secondary" id="btn-close-winner">Close</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal" role="dialog" aria-labelledby="lb-title" style="min-width:420px;">
      <h2 id="lb-title">Leaderboard</h2>
      <div id="leaderboard-content"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-clear-scores">Clear All</button>
        <button class="btn btn-primary" id="btn-close-lb">Close</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
